<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #faf8ef; color: #776e65;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 24px;
  }
  h1 { font-size: 48px; }
  .bar { display: flex; gap: 12px; align-items: center; margin: 16px 0; }
  .score {
    background: #bbada0; color: #fff; border-radius: 6px;
    padding: 8px 16px; font-weight: bold; min-width: 90px; text-align: center;
  }
  .score small { display: block; font-size: 11px; font-weight: normal; text-transform: uppercase; }
  button {
    background: #8f7a66; color: #fff; border: none; border-radius: 6px;
    padding: 10px 20px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #9f8b76; }
  button:disabled { background: #cdc1b4; cursor: default; }
  #board {
    display: grid; grid-template-columns: repeat(4, 90px); grid-template-rows: repeat(4, 90px);
    gap: 10px; background: #bbada0; border-radius: 8px; padding: 10px;
    touch-action: none;
  }
  .cell {
    background: #cdc1b4; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: bold; color: #776e65;
    transition: transform .08s;
  }
  .tile { animation: pop .12s ease; }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  #overlay {
    display: none; margin-top: 14px; padding: 14px 24px;
    background: rgba(238,228,218,.9); border-radius: 8px;
    font-size: 20px; font-weight: bold;
  }
  .hint { margin-top: 12px; font-size: 13px; color: #a89f93; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="bar">
  <div class="score"><small>Score</small><span id="score">0</span></div>
  <div class="score"><small>Best</small><span id="best">0</span></div>
  <button id="undo" disabled>撤销</button>
  <button id="restart">新游戏</button>
</div>
<div id="board"></div>
<div id="overlay"></div>
<p class="hint">方向键 / WASD / 滑动。合并相同数字，凑出 2048。走错了按 Z 撤销。</p>

<script>
// <logic>
// 纯逻辑区：不碰 DOM、不碰 localStorage，行为可被 test/logic.test.mjs 直接覆盖。
const N = 4;

// 把一行向索引 0 方向压缩合并；返回 [新行, 本次得分, 是否发生位移]
function slide(row) {
  const nums = row.filter(v => v);
  const out = [];
  let gained = 0;
  for (let i = 0; i < nums.length; i++) {
    if (i + 1 < nums.length && nums[i] === nums[i + 1]) {
      out.push(nums[i] * 2);
      gained += nums[i] * 2;
      i++;
    } else out.push(nums[i]);
  }
  while (out.length < N) out.push(0);
  return [out, gained, out.some((v, i) => v !== row[i])];
}

// 纯函数：返回新盘面，不改动传入的 grid。dir: 0=left 1=up 2=right 3=down
function applyMove(grid, dir) {
  const next = grid.slice();
  let moved = false, gained = 0;
  for (let line = 0; line < N; line++) {
    const row = [];
    for (let k = 0; k < N; k++) {
      row.push(dir % 2 === 0 ? next[line * N + k] : next[k * N + line]);
    }
    if (dir >= 2) row.reverse();
    const [out, g, m] = slide(row);
    if (dir >= 2) out.reverse();
    gained += g;
    moved = moved || m;
    for (let k = 0; k < N; k++) {
      if (dir % 2 === 0) next[line * N + k] = out[k];
      else next[k * N + line] = out[k];
    }
  }
  return { grid: next, gained, moved };
}

function canMove(grid) {
  if (grid.includes(0)) return true;
  for (let i = 0; i < N * N; i++) {
    const v = grid[i], x = i % N, y = (i / N) | 0;
    if (x + 1 < N && grid[i + 1] === v) return true;
    if (y + 1 < N && grid[i + N] === v) return true;
  }
  return false;
}

// 在空格里随机挑一个位置；棋盘满则返回 -1
function spawnIndex(grid, rand = Math.random) {
  const empty = [];
  grid.forEach((v, i) => { if (!v) empty.push(i); });
  if (!empty.length) return -1;
  return empty[Math.floor(rand() * empty.length)];
}

// 90% 出 2，10% 出 4
function spawnValue(rand = Math.random) {
  return rand() < 0.9 ? 2 : 4;
}
// </logic>

const BEST_KEY = 'best2048';
const STATE_KEY = 'state2048';
const UNDO_LIMIT = 20; // 最多回退 20 步，避免 history 无限增长

let grid, score, over = false, best = +localStorage.getItem(BEST_KEY) || 0;
let history = []; // [{ grid, score }]，每次有效移动前压栈
const board = document.getElementById('board');
const cells = [];
const overlay = document.getElementById('overlay');
const undoBtn = document.getElementById('undo');

for (let i = 0; i < N * N; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  board.appendChild(c);
  cells.push(c);
}

function spawn() {
  const i = spawnIndex(grid);
  if (i < 0) return;
  grid[i] = spawnValue();
}

const COLORS = {
  2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f',
  64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850',
  1024: '#edc53f', 2048: '#edc22e'
};

function render() {
  grid.forEach((v, i) => {
    const c = cells[i];
    c.textContent = v || '';
    c.style.background = v ? (COLORS[v] || '#3c3a32') : '#cdc1b4';
    c.style.color = v > 4 ? '#f9f6f2' : '#776e65';
    c.classList.toggle('tile', !!v);
  });
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  undoBtn.disabled = history.length === 0;
}

// ---- 存档：刷新/关掉页面后接着玩 ----

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({ grid, score }));
  } catch (e) { /* 隐私模式下 localStorage 可能不可写，忽略 */ }
}

function restoreState() {
  let s;
  try { s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (e) { return false; }
  if (!s || !Array.isArray(s.grid) || s.grid.length !== N * N) return false;
  if (!s.grid.every(v => Number.isInteger(v) && v >= 0)) return false;
  grid = s.grid;
  score = Number.isInteger(s.score) ? s.score : 0;
  over = false;
  return true;
}

function move(dir) {
  if (over) return;
  const res = applyMove(grid, dir);
  if (!res.moved) return; // 无效移动不改盘面，也不记入撤销栈
  history.push({ grid: grid.slice(), score });
  if (history.length > UNDO_LIMIT) history.shift();
  grid = res.grid;
  score += res.gained;
  if (score > best) { best = score; localStorage.setItem(BEST_KEY, best); }
  spawn();
  render();
  checkEnd();
  saveState();
}

function undo() {
  const prev = history.pop();
  if (!prev) return;
  grid = prev.grid.slice();
  score = prev.score;
  over = false;
  overlay.style.display = 'none';
  render();
  saveState();
}

function checkEnd() {
  const won = grid.includes(2048), dead = !canMove(grid);
  if (won || dead) {
    over = dead; // win lets you keep playing
    overlay.style.display = 'block';
    overlay.textContent = dead ? '游戏结束 — 点"新游戏"重来，或按 Z 撤销最后一步' : '你凑出 2048 了！还能继续刷分';
  }
}

function reset() {
  grid = new Array(N * N).fill(0);
  score = 0; over = false;
  history = [];
  overlay.style.display = 'none';
  spawn(); spawn();
  render();
  saveState();
}

const KEYS = {
  ArrowLeft: 0, a: 0, ArrowUp: 1, w: 1,
  ArrowRight: 2, d: 2, ArrowDown: 3, s: 3
};
document.addEventListener('keydown', e => {
  if (e.key in KEYS) { e.preventDefault(); move(KEYS[e.key]); }
  else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { e.preventDefault(); undo(); }
});
document.getElementById('restart').addEventListener('click', reset);
undoBtn.addEventListener('click', undo);

// Touch swipe.
let sx = 0, sy = 0;
board.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
board.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 0) : (dy > 0 ? 3 : 1));
});

if (restoreState()) { render(); checkEnd(); } else reset();
</script>
</body>
</html>
